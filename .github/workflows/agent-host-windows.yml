name: Windows Agent Host Transport

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-host-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  named-pipe:
    name: Named pipe conformance
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wanex/runtime run check
      - run: pnpm --filter @wanex/coding run check
      - run: pnpm --filter @wanex/runtime exec vitest run test/local-agent-host-ipc.test.ts
      - run: pnpm --filter @wanex/coding exec vitest run test/agent-host.test.ts
