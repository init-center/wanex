name: Cross-Platform Release Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cross-platform-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install --yes expect gnome-keyring dbus dbus-x11
      - run: node ./scripts/run-linux-keyring-session.mjs pnpm verify
        env:
          WANEX_TEST_CONCURRENCY: 2
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: pnpm security:js
      - run: pnpm security:rust

  packed-core-node24:
    name: Packed Core Node 24
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - run: pnpm install --frozen-lockfile --config.engine-strict=false
      - run: cargo build
      - run: pnpm release:sdk
      - run: pnpm proof:sdk-consumers

  distribution:
    name: Distribution ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            desktop: false
          - os: macos-15
            target: darwin-arm64
            desktop: true
          - os: macos-15-intel
            target: darwin-x64
            desktop: true
          - os: windows-2025
            target: win32-x64
            desktop: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - run: pnpm install --frozen-lockfile
      - run: pnpm stage:native -- --target ${{ matrix.target }}
      - run: pnpm proof:native-runtime
      - if: matrix.target == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install --yes expect gnome-keyring dbus dbus-x11
      - if: matrix.target == 'linux-x64'
        run: node ./scripts/run-linux-keyring-session.mjs pnpm proof:tui -- --native-artifact-dir target/distribution/native
      - if: matrix.target != 'linux-x64'
        run: pnpm proof:tui -- --native-artifact-dir target/distribution/native
      - if: matrix.desktop
        run: pnpm check:desktop
      - if: matrix.desktop
        run: pnpm test:desktop
      - if: matrix.desktop
        run: pnpm --filter @wanex/desktop prepare:electron
      - if: matrix.desktop
        run: pnpm proof:desktop
      - if: matrix.desktop
        run: pnpm proof:desktop-distribution -- --target ${{ matrix.target }}
      - run: pnpm audit:host-distribution -- --target ${{ matrix.target }} --tui-receipt target/distribution/tui/installed-proof.json --desktop-distribution-receipt target/distribution/desktop/desktop-distribution-receipt.json
      - run: pnpm release:sdk
      - run: pnpm release:native -- --target ${{ matrix.target }}
      - run: pnpm proof:sdk-consumers -- --native-target ${{ matrix.target }} --native-package-report target/sdk/native/${{ matrix.target }}/report.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: wanex-distribution-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/distribution/native
            target/distribution/native-runtime-proof.json
            target/distribution/tui
            target/distribution/host-distribution-audit-${{ matrix.target }}.json
            target/distribution/desktop/electron-artifact.json
            target/distribution/desktop/desktop-report.json
            target/distribution/desktop/desktop-distribution-receipt.json
            target/distribution/desktop/desktop-proof-normal.png
            target/distribution/desktop/desktop-proof-narrow.png
            target/sdk/native/${{ matrix.target }}
