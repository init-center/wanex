name: Cross-Platform Release Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cross-platform-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-2025
            target: win32-x64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  distribution:
    name: Distribution ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            electron: false
          - os: macos-15
            target: darwin-arm64
            electron: true
          - os: macos-15-intel
            target: darwin-x64
            electron: true
          - os: windows-2025
            target: win32-x64
            electron: true

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - run: pnpm install --frozen-lockfile
      - run: pnpm stage:native -- --target ${{ matrix.target }}
      - run: pnpm proof:native-runtime -- --samples 5
      - if: matrix.electron
        run: pnpm check:electron-boundary
      - if: matrix.electron
        run: pnpm test:electron-boundary
      - if: matrix.electron
        run: pnpm proof:electron-boundary
      - run: pnpm audit:host-distribution -- --target ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: wanex-distribution-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/distribution/native
            target/distribution/native-runtime-proof.json
            target/distribution/host-distribution-audit-${{ matrix.target }}.json
            target/distribution/electron/electron-boundary-report.json
