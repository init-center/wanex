name: Native Electron Boundary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-electron-boundary.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/product-app-local/**"
      - "scripts/electron-boundary/**"
      - "scripts/native-artifact/**"
      - "packages/runtime/**"
      - "packages/storage/**"
  push:
    branches: [main]

jobs:
  native-electron:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - run: pnpm install --frozen-lockfile
      - run: cargo fmt -- --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release -p wanex-system-service
      - run: pnpm stage:native
      - run: pnpm check:electron-boundary
      - run: pnpm test:electron-boundary
      - run: pnpm proof:electron-boundary -- --samples 5

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: wanex-native-electron-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/distribution/electron/electron-boundary-report.json
            target/distribution/native
